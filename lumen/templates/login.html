{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block page_class %}narrow{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">Lumen is an AI assistant for {{ org_name }}. <a href="{{ url_for('pages.transparency') }}">How it works</a></p>
<form class="card stack" method="post" novalidate>
  {{ csrf_field() }}
  <div class="field"><label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus></div>
  <div class="field"><label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn" type="submit">Sign in</button>
</form>
<p class="mt2 small muted">No account yet? <a href="{{ url_for('auth.register') }}">Create one</a>.</p>
{% endblock %}
